name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download this run's tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --dir release-assets
      - name: Verify and publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          for directory in release-assets/eqiora-*; do (cd "$directory" && sha256sum -c ./*.sha256); done
          version=$(node -p 'require("./package.json").version')
          gh release create "v$version" --target "$RELEASE_COMMIT" --title "Eqiora for VS Code $version" --notes-file CHANGELOG.md release-assets/eqiora-*/*.vsix release-assets/eqiora-*/*.sha256
